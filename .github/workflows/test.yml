name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust と WebAssembly のターゲットを入れる
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: 各章のテスト
        run: tools/verify.sh
      - name: デモ ROM をソースから作り直すと同じものになる
        run: |
          roms/build.sh
          git diff --exit-code roms/
